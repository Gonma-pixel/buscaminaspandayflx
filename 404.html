<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          let _fetch = window.fetch ? window.fetch.bind(window) : null;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(val) {
              _fetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        window.addEventListener('error', function(e) {
          if (e.filename && e.filename.indexOf('chrome-extension://') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        // Normalize trailing slash on GitHub Pages so relative assets resolve correctly
        if (window.location.hostname.endsWith('github.io')) {
          var p = window.location.pathname;
          if (!p.endsWith('/') && !p.split('/').pop().includes('.')) {
            window.location.replace(p + '/' + window.location.search + window.location.hash);
          }
        }
      })();
    </script>
    <title>Buscaminas de Flx y Panda</title>
    <meta name="description" content="Juego clásico de Buscaminas espacial de Flx y Panda, con escáner de pulso gravitacional y anomalías cósmicas." />
    <meta property="og:title" content="Buscaminas de Flx y Panda" />
    <meta property="og:description" content="Juego clásico de Buscaminas espacial de Flx y Panda, con escáner de pulso gravitacional y anomalías cósmicas." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="./assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Fallback for static hosting (e.g. GitHub Pages root)
      window.addEventListener('error', function(e) {
        if (e.target && e.target.src && e.target.src.indexOf('/src/main.tsx') !== -1) {
          var s = document.createElement('script');
          s.type = 'module';
          s.crossOrigin = '';
          s.src = './assets/index.js';
          document.body.appendChild(s);
          var l = document.createElement('link');
          l.rel = 'stylesheet';
          l.crossOrigin = '';
          l.href = './assets/index.css';
          document.head.appendChild(l);
        }
      }, true);
    </script>
  </body>
</html>
